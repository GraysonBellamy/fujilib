name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  UV_FROZEN: "1"

jobs:
  # Publishing depends on the same revision passing the full CI workflow and
  # the docs build (design §11).
  checks:
    name: CI
    uses: ./.github/workflows/ci.yml

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0  # hatch-vcs needs full history
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install docs extras
        run: uv sync --group docs
      - name: Build
        run: uv run zensical build --clean

  build:
    name: Build distribution
    needs: [checks, docs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0  # hatch-vcs needs full history
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Build sdist + wheel
        run: uv build
      - name: Check artifacts
        run: uv run --with twine twine check --strict dist/*
      # Not "dist": the reused CI workflow uploads an artifact of that name in
      # this same run, and artifact names must be unique per run.
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/fujilib/
    permissions:
      id-token: write      # OIDC trusted publishing
      attestations: write  # sigstore attestations
      contents: read
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-dist
          path: dist/
      - name: Publish via OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true
          attestations: true
